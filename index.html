<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výběr Her</title>
    <style>
        /* Světlé a vzdušné barvy */
        :root {
            --bg-main: #f8fafc; /* Velmi jemná modro-šedá */
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --accent: #3b82f6; /* Modrá pro běžné hry */
            --accent-hover: #2563eb;
            --twd-color: #ea580c; /* Oranžová speciálně pro TWD */
            --twd-hover: #c2410c;
            --border-radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hlavička stránky */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* Mřížka pro karty her */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        /* Jednotlivá karta hry */
        .game-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e2e8f0;
        }

        /* Efekt při najetí myší */
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
        }

        /* Ikonka nahoře na kartě */
        .icon-wrapper {
            width: 60px;
            height: 60px;
            background-color: #eff6ff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .twd-icon { 
            background-color: #fff7ed; 
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 8px 0;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 24px 0;
            flex-grow: 1; /* Roztáhne text, aby tlačítka byla dole zarovnaná */
        }

        /* Tlačítka pro otevření složky */
        .card-link {
            display: inline-block;
            text-align: center;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .card-link:hover {
            background-color: var(--accent-hover);
        }

        .twd-link { 
            background-color: var(--twd-color); 
        }

        .twd-link:hover { 
            background-color: var(--twd-hover); 
        }
    </style>
</head>
<body>

    <header>
        <h1>Herní Knihovna</h1>
        <p class="subtitle">Vyber hru a hraj</p>
    </header>

    <div class="grid-container">
        <div class="game-card">
            <div class="icon-wrapper twd-icon">🧟</div>
            <h2 class="card-title">The Walking Dead</h2>
            <p class="card-desc"> Přežití vln.</p>
            <a href="TWD/" class="card-link twd-link">The Walking Dead: Echoes of Fallen</a>
        </div>


    </div>

</body>
</html>
