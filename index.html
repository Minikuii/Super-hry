<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Tvoje Knihovna</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-panel: #14181f;
            --accent-orange: #d97706;
            --accent-orange-hover: #f59e0b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --transition: all 0.2s ease-in-out;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Hlavní kontejner stránky */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Karta pro TWD - hlavní prvek */
        .twd-card {
            background-color: var(--bg-panel);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #1f2937;
            transition: var(--transition);
        }

        .twd-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            border-color: #374151;
        }

        /* Sekce s obrázkem a grafikou */
        .twd-hero {
            background-image: linear-gradient(to bottom, rgba(20, 24, 31, 0.5), rgba(20, 24, 31, 1)), 
                              url('https://images.unsplash.com/photo-1599661046289-e31897846e41?q=80&w=1600&auto=format&fit=crop'); /* Ilustrační obrázek lesa/pustiny */
            background-size: cover;
            background-position: center;
            height: 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .twd-title-group h1 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .twd-title-group p {
            color: var(--text-muted);
            margin: 5px 0 0;
            font-size: 1.1rem;
        }

        /* Sekce s obsahem pod obrázkem */
        .twd-content {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Odkaz na složku - tlačítko */
        .folder-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--accent-orange);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(217, 119, 6, 0.3);
        }

        .folder-link:hover {
            background-color: var(--accent-orange-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(217, 119, 6, 0.4);
        }

        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="twd-card">
            <div class="twd-hero">
                <div class="twd-title-group">
                    <h1>The Walking Dead</h1>
                    <p>The Telltale Series</p>
                </div>
            </div>
            
            <div class="twd-content">
                <a href="hry TWD/" class="folder-link">
                    <span class="icon">📁</span>
                    Otevřít složku hry
                </a>
            </div>
        </div>
    </div>

</body>
</html>
