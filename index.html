<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Hry</title>
    <style>
        /* Čistý a klidný tmavý režim */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #202124;
            color: #e8eaed;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

        /* Hlavní panel */
        .dashboard {
            background-color: #292a2d;
            border: 1px solid #3c4043;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        p {
            color: #9aa0a6;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Normální, slušné tlačítko */
        .folder-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #3c4043;
            color: #e8eaed;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        .folder-link:hover {
            background-color: #4a4d51;
        }

        .icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Knihovna her</h1>
        <p>Lokální rozcestník pro tvé soubory</p>

        <a href="hry TWD/" class="folder-link">
            
            The Walking Dead
        </a>
    </div>

</body>
</html>
