<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herní Doupě</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #e50914;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #b20710;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
        }
        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        nav a:hover {
            color: #e50914;
        }
        .container {
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .game-folder {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 30px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.2s;
        }
        .game-folder:hover {
            background-color: #218838;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Moje Videohry</h1>
    </header>

    <nav>
        <a href="#">Novinky</a>
        <a href="#">Knihovna</a>
        <a href="#">Oblíbené</a>
    </nav>

    <div class="container">
        <h2>Vítej v hlavním rozcestníku!</h2>
        <p>Zde najdeš přístup ke všem svým uloženým hrám a projektům. Kliknutím na tlačítko níže přejdeš přímo do sekce přežití se zombíky.</p>

        <a href="hry TWD/" class="game-folder">📁 Otevřít složku hry TWD</a>
    </div>

</body>
</html>
